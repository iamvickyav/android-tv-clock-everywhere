plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vicky.clockeverywhere'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vicky.clockeverywhere'
        minSdk 26
        targetSdk 34
        versionCode 100
        versionName '1.0.0'
    }

    signingConfigs {
        debugPersistent {
            def path = System.getenv('CLOCK_DEBUG_KEYSTORE_PATH')
            if (path) {
                storeFile file(path)
                storePassword System.getenv('CLOCK_DEBUG_STORE_PASSWORD')
                keyAlias System.getenv('CLOCK_DEBUG_KEY_ALIAS')
                keyPassword System.getenv('CLOCK_DEBUG_KEY_PASSWORD')
            }
        }

        release {
            def path = System.getenv('CLOCK_RELEASE_KEYSTORE_PATH')
            if (path) {
                storeFile file(path)
                storePassword System.getenv('CLOCK_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('CLOCK_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('CLOCK_RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            if (System.getenv('CLOCK_DEBUG_KEYSTORE_PATH')) {
                signingConfig signingConfigs.debugPersistent
            }
        }

        release {
            minifyEnabled false
            if (System.getenv('CLOCK_RELEASE_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }
}
